[package]
name = "wa-lite"
version = "0.1.0"
edition = "2021"

[dependencies]
wry = "=0.44.1"
tao = "=0.30.0"

# Menyematkan ikon ke wa-lite.exe (hanya saat build di Windows).
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"     # ukuran biner kecil
lto = true
codegen-units = 1
panic = "abort"
strip = true
